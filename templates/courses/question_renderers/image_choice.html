{% load i18n_dict %}
<div class="onlenco-qr onlenco-qr--image-choice">
    {% if question_metadata.options %}
    <div class="onlenco-qr__image-grid">
        {% for opt in question_metadata.options %}
        <label class="onlenco-qr__image-card">
            <input type="radio" name="answer" value="{{ opt.id }}" required>
            <span class="onlenco-qr__image-frame">
                {% if opt.image_url %}
                    <img src="{{ opt.image_url }}" alt="{{ opt.text }}" loading="lazy">
                {% else %}
                    <span class="onlenco-qr__image-placeholder" aria-hidden="true">🖼</span>
                {% endif %}
            </span>
            <span class="onlenco-qr__image-label" dir="ltr">{{ opt.text }}</span>
            {% if opt.text_ar %}<span class="onlenco-qr__image-label-ar" dir="rtl">{{ opt.text_ar }}</span>{% endif %}
        </label>
        {% endfor %}
    </div>
    {% else %}
    {% include "courses/challenge/components/empty_state.html" %}
    {% endif %}
</div>
