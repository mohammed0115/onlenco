{% load i18n_dict i18n static %}
<header class="border-b border-border/40 bg-background/80 backdrop-blur-xl sticky top-0 z-40">
    <div class="container flex h-16 items-center justify-between">
        <a href="{% url 'home' %}" class="flex items-center gap-2 font-display text-xl font-bold" aria-label="{% trans 'Onlenco home' %}">
            <img src="{% static 'img/onlenco-logo.png' %}" alt="Onlenco"
                 class="h-9 w-auto object-contain" width="36" height="36">
            <span class="sr-only">Onlenco</span>
        </a>
        <div class="flex items-center gap-2">
            {% if request.user.is_authenticated %}
              <a href="{% url 'profile' %}" class="btn btn-ghost"
                 style="height:2.25rem;font-size:0.8125rem"
                 title="{% t_either 'Profile & settings' 'الحساب والإعدادات' %}"
                 data-testid="header-profile-link">
                <i data-lucide="user" class="h-4 w-4"></i>
                <span class="hidden sm:inline">{% t_either "Profile" "حسابي" %}</span>
              </a>
            {% endif %}
            {% if request.user.profile.is_admin %}
              <a href="{% url 'analytics' %}" class="btn btn-ghost" style="height:2.25rem;font-size:0.8125rem">
                <i data-lucide="bar-chart-3" class="h-4 w-4"></i>
                {% trans "Analytics" %}
              </a>
            {% endif %}
            {% include "_lang_toggle.html" %}
            <form action="{% url 'logout' %}" method="post" class="inline">
                {% csrf_token %}
                <button type="submit" class="btn btn-ghost" style="height:2.25rem;font-size:0.8125rem">
                    <i data-lucide="log-out" class="h-4 w-4"></i> {% t "dash.signout" %}
                </button>
            </form>
        </div>
    </div>
</header>
