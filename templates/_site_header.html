{% load i18n_dict %}
<header class="sticky top-0 z-50 w-full border-b border-border/40 bg-background/80 backdrop-blur-xl">
    <div class="container flex h-16 items-center justify-between">
        <a href="{% url 'home' %}" class="flex items-center gap-2 font-display text-xl font-bold">
            <div class="flex h-8 w-8 items-center justify-center rounded-lg gradient-sunset shadow-glow">
                <i data-lucide="sparkles" class="h-4 w-4 text-primary-foreground"></i>
            </div>
            <span>Onlenco</span>
        </a>

        <nav class="hidden items-center gap-8 md:flex">
            <a href="#features"   class="text-sm font-medium text-muted-foreground hover:text-foreground transition-smooth">{% t "nav.features" %}</a>
            <a href="#curriculum" class="text-sm font-medium text-muted-foreground hover:text-foreground transition-smooth">{% t "nav.curriculum" %}</a>
            <a href="{% url 'dictionary' %}" class="text-sm font-medium text-muted-foreground hover:text-foreground transition-smooth">
                {% t_either "Dictionary" "القاموس" %}
            </a>
            <a href="#pricing"    class="text-sm font-medium text-muted-foreground hover:text-foreground transition-smooth">{% t "nav.pricing" %}</a>
        </nav>

        <div class="flex items-center gap-2">
            {% include "_lang_toggle.html" %}
            {% if request.user.is_authenticated %}
                <a href="{% url 'dashboard' %}" class="btn btn-hero" style="height:2.25rem;font-size:0.8125rem">
                    {% t "dash.lessons" %}
                </a>
            {% else %}
                <a href="{% url 'auth' %}" class="btn btn-ghost" style="height:2.25rem;font-size:0.8125rem">{% t "nav.signin" %}</a>
                <a href="{% url 'auth' %}?mode=signup" class="btn btn-hero" style="height:2.25rem;font-size:0.8125rem">{% t "nav.start" %}</a>
            {% endif %}
        </div>
    </div>
</header>
