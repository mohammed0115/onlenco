{% extends "base.html" %}
{% block body %}
<div class="container py-10 max-w-md">
  <h1 class="text-2xl font-bold mb-4">Choose a new password</h1>
  {% if validlink %}
    <form method="post" class="space-y-3">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-hero">Set new password</button>
    </form>
  {% else %}
    <p>This reset link is invalid or has expired.</p>
  {% endif %}
</div>
{% endblock %}
