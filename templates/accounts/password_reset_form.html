{% extends "base.html" %}
{% block body %}
<div class="container py-10 max-w-md">
  <h1 class="text-2xl font-bold mb-4">Reset your password</h1>
  <form method="post" class="space-y-3">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-hero">Send reset link</button>
  </form>
</div>
{% endblock %}
