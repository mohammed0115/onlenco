# Bare-metal Nginx alternative to Caddy.
#
# Use this if you'd rather run Nginx + certbot directly on the host instead
# of letting Caddy do TLS in a container. Place at:
#   /etc/nginx/sites-available/sudaschool.academy
# then `ln -s … /etc/nginx/sites-enabled/`, run certbot, and restart nginx.
#
#   sudo apt install nginx certbot python3-certbot-nginx
#   sudo certbot --nginx -d sudaschool.academy -d www.sudaschool.academy

upstream onlenco_web {
    server 127.0.0.1:8000 fail_timeout=0;
}

# HTTP → HTTPS redirect (certbot replaces this block on its own when run)
server {
    listen 80;
    listen [::]:80;
    server_name sudaschool.academy www.sudaschool.academy;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sudaschool.academy www.sudaschool.academy;

    # certbot fills these in automatically with `certbot --nginx`
    # ssl_certificate     /etc/letsencrypt/live/sudaschool.academy/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/sudaschool.academy/privkey.pem;
    # include             /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 30M;
    keepalive_timeout 65;

    # Hardened headers (most are also set by Django in production.py)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # Whitenoise serves static via gunicorn — no aliasing needed.

    location /healthz/ {
        proxy_pass http://onlenco_web;
        access_log off;
    }

    location / {
        proxy_pass         http://onlenco_web;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_redirect     off;
        proxy_buffers      8 16k;
        proxy_buffer_size  32k;
        proxy_read_timeout 60s;
    }
}
