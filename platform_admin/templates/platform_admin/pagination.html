{% if page_obj %}
<div class="pagination">
  <div class="muted">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</div>
  <div class="filters">
    {% if page_obj.has_previous %}
      <a class="btn-control" href="?page={{ page_obj.previous_page_number }}">Previous</a>
    {% endif %}
    {% if page_obj.has_next %}
      <a class="btn-control" href="?page={{ page_obj.next_page_number }}">Next</a>
    {% endif %}
  </div>
</div>
{% endif %}
