  - id: wo_w1_004
    scrambled: [an, This, apple, is]
    correct_answer: "This is an apple"
    explanation_ar: "قبل كلمة تبدأ بحرف صوتي (A, E, I, O) نستخدم 'an' بدل 'a'."

  - id: wo_w1_005
    scrambled: [an, is, egg, This]
    correct_answer: "This is an egg"

  - id: wo_w1_006
    scrambled: [is, This, a, fish]
    correct_answer: "This is a fish"

  - id: wo_w1_007
    scrambled: [house, This, is, a]
    correct_answer: "This is a house"

  - id: wo_w1_008
    scrambled: [is, juice, This]
