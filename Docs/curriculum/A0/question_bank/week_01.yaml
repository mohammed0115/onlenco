# -------------------------------------------------------------------
# 7. SPEAKING — 5 of 20 (STT-scored)
# -------------------------------------------------------------------
speaking:
  - id: sp_w1_001
    prompt_ar: "قل بصوت عال: A"
    target_text: A
    stt_required: true
    accepted_variants: [a, A]

  - id: sp_w1_002
    prompt_ar: "قل: This is a book."
    target_text: "This is a book"
    stt_required: true
    accepted_variants: ["this is a book", "this is book"]   # forgive missing 'a'

  - id: sp_w1_003
    prompt_ar: "قل: cat"
    target_text: cat

  - id: sp_w1_004
    prompt_ar: "قل: water"
    target_text: water

  - id: sp_w1_005
    prompt_ar: "قل أول 4 حروف من الأبجدية: A B C D"
    target_text: "A B C D"

# -------------------------------------------------------------------
# 8. WRITING — 5 of 20
# -------------------------------------------------------------------
writing:
  - id: wr_w1_001
    prompt_ar: "اكتب الحرف الكبير لـ a"
    correct: A
    case_sensitive: true

  - id: wr_w1_002
    prompt_ar: "اكتب الكلمة: تفاحة"
    correct: apple

  - id: wr_w1_003
    prompt_ar: "اكتب الكلمة: كتاب"
    correct: book

  - id: wr_w1_004
    prompt_ar: "اكتب الجملة: هذا قط."
    correct: "This is a cat"
    case_sensitive: false

  - id: wr_w1_005
    prompt_ar: "اكتب أول 6 حروف من الأبجدية"
    correct: "A B C D E F"
    accepted_variants: ["a b c d e f", "abcdef"]
