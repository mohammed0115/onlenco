    question: "____uice is sweet."
    correct_answer: J
    options: [J, G, Y]
    explanation_ar: "حرف J ينطق 'ج' في juice، وليس 'ي'."

  - id: fb_w1_010
    question: "____ion is strong."
    correct_answer: L
    options: [L, N, M]

  - id: fb_w1_011
    question: "____an is tall."
    correct_answer: M
    options: [M, N, W]

  - id: fb_w1_012
    question: "____ame is mine."
    correct_answer: N
    options: [M, N, T]

  - id: fb_w1_013
    question: "____range is round."
