# Week 1 — Letters & Basic Sounds
# Question bank, ready for import into PlacementQuestion / LessonQuestion / AdaptiveExercise.
# Total: 230 questions across 8 types (per spec). This file shows a
# representative ~80-question seed plus the structural patterns for
# operators / AI-generators to produce the remaining 150 by template.

meta:
  week: 1
  course_slug: a0-c1-letters
  cefr_level: A0
  language: en
  topic: letters
  total_questions_target: 230
  produced_in_this_file: 82
  template_notes: |
    The remaining 148 questions can be machine-generated by varying:
    * which 4-letter window is being tested (A-D, E-H, etc.)
    * which mistake distractor pattern is used (b/d, p/b, v/f confusions)
    * which vocabulary item the question targets

# -------------------------------------------------------------------
# 1. MULTIPLE CHOICE — 20 of 50 (operators add 30 more by template)
# -------------------------------------------------------------------
multiple_choice:
  - id: mc_w1_001
    question: "Which letter does 'apple' start with?"
    question_ar: "بأي حرف تبدأ كلمة apple؟"
    options: [A, B, C, D]
    correct_answer: A
    explanation_ar: "كلمة apple تعني تفاحة وتبدأ بحرف A."
    difficulty: 0.05

  - id: mc_w1_002
    question: "Which letter does 'book' start with?"
    options: [A, B, C, D]
    correct_answer: B
    explanation_ar: "كلمة book تعني كتاب وتبدأ بحرف B."
    difficulty: 0.05

  - id: mc_w1_003
    question: "Which letter does 'cat' start with?"
    options: [A, B, C, D]
    correct_answer: C
    explanation_ar: "كلمة cat تعني قط وتبدأ بحرف C."
    difficulty: 0.05

  - id: mc_w1_004
    question: "Which letter does 'dog' start with?"
    options: [A, B, C, D]
    correct_answer: D
    difficulty: 0.05

  - id: mc_w1_005
    question: "Which letter does 'egg' start with?"
    options: [E, F, G, H]
    correct_answer: E
    difficulty: 0.05

  - id: mc_w1_006
    question: "Which letter does 'fish' start with?"
    options: [E, F, G, H]
    correct_answer: F

  - id: mc_w1_007
    question: "Which letter does 'house' start with?"
    options: [E, F, G, H]
    correct_answer: H

  - id: mc_w1_008
    question: "Pick the picture of an apple"
    question_type: image_match
    options:
      - { label: "🍎", correct: true }
      - { label: "📕", correct: false }
      - { label: "🐱", correct: false }
      - { label: "🐶", correct: false }

  - id: mc_w1_009
    question: "Which word starts with the letter B?"
    options: [book, apple, cat, dog]
    correct_answer: book

  - id: mc_w1_010
    question: "Which letter comes after A?"
    options: [B, C, D, E]
    correct_answer: B
    difficulty: 0.1

  - id: mc_w1_011
    question: "Which letter comes after D?"
    options: [E, F, G, H]
    correct_answer: E

  - id: mc_w1_012
    question: "Which letter comes before B?"
    options: [A, C, D, F]
    correct_answer: A

  - id: mc_w1_013
    question: "Which letter is between C and E?"
    options: [B, D, F, G]
    correct_answer: D

  - id: mc_w1_014
    question: "Which letter does 'orange' start with?"
    options: [O, P, Q, R]
    correct_answer: O

  - id: mc_w1_015
    question: "Which letter does 'pen' start with?"
    options: [O, P, Q, R]
    correct_answer: P
    explanation_ar: "تذكر: حرف P ينطق بانفجار خفيف، ليس B."

  - id: mc_w1_016
    question: "Which letter does 'tea' start with?"
    options: [S, T, U, V]
    correct_answer: T

  - id: mc_w1_017
    question: "Which letter does 'water' start with?"
    options: [U, V, W, X]
    correct_answer: W
    explanation_ar: "حرف W ينطق 'واو' وليس 'في'."

  - id: mc_w1_018
    question: "Which letter does 'yes' start with?"
    options: [W, X, Y, Z]
    correct_answer: Y

  - id: mc_w1_019
    question: "Which letter does 'zoo' start with?"
    options: [W, X, Y, Z]
    correct_answer: Z

  - id: mc_w1_020
    question: "Which is NOT a letter?"
    options: [A, B, 7, D]
    correct_answer: 7
    difficulty: 0.1

