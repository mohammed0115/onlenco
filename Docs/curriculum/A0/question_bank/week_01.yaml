    question: "____at is small."
    correct_answer: C
    options: [B, C, D]

  - id: fb_w1_004
    question: "____og is big."
    correct_answer: D
    options: [B, D, G]
    explanation_ar: "احذر: b و d متشابهان شكلاً، لكن dog يبدأ بـ d."

