  - id: fb_w1_016
    question: "____ed is a color."
    correct_answer: R
    options: [R, P, B]

  - id: fb_w1_017
    question: "____un is hot."
    correct_answer: S
    options: [S, F, T]

  - id: fb_w1_018
    question: "____ea is brown."
    correct_answer: T
    options: [T, D, P]

  - id: fb_w1_019
    question: "____ater is clear."
    correct_answer: W
    options: [V, W, F]
    explanation_ar: "حرف W ينطق 'واو'؛ لا تخلطه مع V."

  - id: fb_w1_020
    question: "____es. I agree."
    correct_answer: Y
    options: [Y, J, I]

