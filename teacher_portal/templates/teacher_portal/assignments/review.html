{% extends "teacher_portal/base.html" %}

{% block teacher_title %}Review Submission{% endblock %}

{% block teacher_content %}
<section class="teacher-panel">
  <p>{{ submission.text_answer|linebreaksbr }}</p>
</section>
<form class="teacher-form" method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button class="teacher-btn teacher-btn-primary" type="submit"><i data-lucide="check"></i>Save review</button>
</form>
{% endblock %}
