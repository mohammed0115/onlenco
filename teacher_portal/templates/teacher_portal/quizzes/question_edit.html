{% extends "teacher_portal/base.html" %}

{% block teacher_title %}{% if lang == "ar" %}تعديل سؤال{% else %}Edit Question{% endif %}{% endblock %}

{% block teacher_content %}
<form class="teacher-form" method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <div class="form-actions">
    <button class="teacher-btn teacher-btn-primary" type="submit">
      <i data-lucide="save"></i>{% if lang == "ar" %}حفظ{% else %}Save{% endif %}
    </button>
  </div>
</form>
{% endblock %}
